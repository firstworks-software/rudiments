<html>
<head>
	<title>Address Book</title>
</head>
<body>
	Address Book for $(login):<br><br>
	<table>
	<tr>
	<th>Name</th><th>Address</th><th>City</th>
	<th>State</th><th>Phone Number</th>
	</tr>
	<!-- start addressentry -->
	<tr>
	<td>$(name)</td><td>$(address)</td><td>$(city)</td>
	<td>$(state)</td><td>$(phonenumber)</td>
	<tr>
	<!-- end addressentry -->
	</table>
</body>
</html>
